# Replaces the stock nginx-unprivileged default server.
#
# Astro emits directory-style pages (/talks/index.html). We want BOTH /talks
# and /talks/ to return that page as a direct 200 — no redirect. Serving it
# directly (rather than 301-ing to add the trailing slash) means nginx never
# writes a Location header, so the container's internal :8080 can never leak
# out behind a reverse proxy.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Defence in depth: should anything ever redirect, keep it relative so the
    # internal scheme/host/:8080 still never leaks.
    absolute_redirect off;

    # llms.txt, manifesto.md and the page text are UTF-8 (Øredev, ·, —).
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json text/xml application/xml image/svg+xml;

    # /talks -> /talks/index.html, /talks/ -> /talks/index.html,
    # both served in place with no client-visible redirect.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # nginx's mime.types has no entry for .md, so /manifesto.md would download
    # as application/octet-stream instead of displaying.
    location ~ \.md$ {
        types { text/markdown md; }
        try_files $uri =404;
    }

    # Astro fingerprints everything under /_astro/, so it can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
